name: Test

# Runs the test suite on every push + PR. The existing deploy
# workflow runs INDEPENDENTLY on push-to-main (so a failing test
# does NOT currently block deploy — we'll wire that gate once the
# test suite covers enough of the surface to make the gate
# meaningful, probably after the multi-tenant migration ships).
#
# 2026-05-16 — added as part of Phase 1 (multi-tenant foundations).
# First job: prove tests run green in CI. Once we have ~50+ tests
# covering rules + critical helpers, this workflow becomes a deploy
# blocker.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # the debug agent's PR job starts this on autofix/* branches

# This runs code from unmerged branches, so it never gets write access or secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # unmerged code must not be able to hold a job slot for hours
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # no npm cache: the debug agent could poison it (see debug-agent.yml)

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
